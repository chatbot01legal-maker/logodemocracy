<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Academia | Logodemocracy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/assets/css/base-layout.css">
  <link rel="stylesheet" href="/assets/css/archive.css">
</head>
<body>

<div class="page">

<header class="topbar">
  <a href="/" class="brand">LOGODEMOCRACY</a>
  <nav class="module-nav">
    <a href="/pages/archive-template.html" class="module-link active">Academia</a>
    <a href="/pages/sophia.html" class="module-link">Sophia</a>
  </nav>
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 6H20"/><path d="M4 12H20"/><path d="M4 18H20"/>
    </svg>
  </button>
  <div class="topbar-right"></div>
</header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="tree" id="tree"></div>

        <!-- TARJETA SOPHIA: HUD compacto e interactivo -->
        <div class="sophia-score-card" id="sophia-score-block" onclick="window.openSophiaModal()" role="button" tabindex="0" title="Ver evaluación completa de Sophia">
          <div class="sophia-card-info">
            <div class="sophia-card-tag">
              <span class="sophia-status-dot"></span>
              <span>SOPHIA</span>
            </div>
            <span class="sophia-card-action">Ver análisis ↗</span>
          </div>
          <div class="sophia-card-score">
            <span id="sophia-ird" class="sophia-score-value">--</span>
            <span class="sophia-score-max">/100</span>
          </div>
        </div>

        <div class="philosopher">
          <div class="philosopher-title">🏛 Rey Filósofo</div>
          <div class="philosopher-text">¿Quieres profundizar en esta idea?</div>
          <button class="philosopher-btn">Profundizar</button>
        </div>
      </div>

      <div class="sidebar-rail">
        <div class="sidebar-toggle">◂</div>
      </div>
    </aside>

    <main class="document">
      <div class="document-header">
        Platón soñó con reyes filósofos. Nosotros exploramos otra posibilidad. Que cualquier ciudadano pueda aprender a pensar como uno. Bienvenido a la Academia.
      </div>
      <div class="document-content">
        <div class="content" id="content"></div>
      </div>
    </main>
  </div>

  <footer class="footer">
    LogoDemocracy · Academia
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/mobile-menu.js"></script>
<script src="/assets/js/archive.js?v=8"></script>
<script src="/CognitiveSessionFactory.js?v=6"></script>
<script src="/ReyFilosofoChat.js?v=6"></script>
<script src="/assets/js/sophia.js?v=20260806"></script>

<script>
  window.addEventListener("load", () => {
    if (typeof ReyFilosofoChat !== 'undefined' && typeof ReyFilosofoChat.setDefaultSessionProvider === 'function') {
      ReyFilosofoChat.setDefaultSessionProvider(() => {
        const asset = window.Academy && typeof window.Academy.getCurrentCognitiveAsset === 'function'
          ? window.Academy.getCurrentCognitiveAsset()
          : null;
        if (!asset || typeof CognitiveSessionFactory === 'undefined') return null;
        return CognitiveSessionFactory.fromAcademy(asset);
      });
    }

    const btn = document.querySelector(".philosopher-btn");
    if (btn) {
      btn.addEventListener("click", () => {
        const asset = window.Academy && typeof window.Academy.getCurrentCognitiveAsset === 'function'
          ? window.Academy.getCurrentCognitiveAsset()
          : null;

        if (!asset) return;

        if (typeof CognitiveSessionFactory === 'undefined' || typeof ReyFilosofoChat === 'undefined') {
          console.error("Módulos cognitivos no disponibles.");
          return;
        }

        const session = CognitiveSessionFactory.fromAcademy(asset);
        ReyFilosofoChat.open(session);
      });
    }
  });
</script>

</body>
</html>
