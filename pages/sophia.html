<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophia</title>

  <link rel="stylesheet" href="/assets/css/base-layout.css">
  <link rel="stylesheet" href="/assets/css/sophia.css">
</head>

<body>

<div class="page">

  <!-- =========================
       HEADER LIMPIO (CORRECTO)
  ========================== -->
  
<div id="global-header"></div>

  <script src="/assets/js/header.js"></script>

<script>

document.getElementById("global-header")
.innerHTML =
renderGlobalHeader("sophia");

</script>

<script src="/assets/js/layout.js"></script>

<script src="/assets/js/sophia.js"></script>
  <!-- =========================
       LAYOUT (NO TOCADO)
  ========================== -->
  <div class="layout">

    <aside class="sidebar">

      <div class="sidebar-content">

        <div class="tree">
          Open Source Cognitivo
        </div>

        <div class="epistemic">

          <div class="epistemic-title">
            Indicadores
          </div>

          <div>Verificabilidad</div>
          <div>Falacias</div>
          <div>Sesgos</div>
          <div>Claridad</div>

        </div>

        <div class="philosopher">

          <div>🏛 Rey Filósofo</div>
          <div>¿Quieres comprender este resultado?</div>

        </div>

      </div>

      <div class="sidebar-rail">
        <div class="sidebar-toggle">◂</div>
      </div>

    </aside>

    <main class="document">

      <div class="document-header">
        Sophia evalúa conocimiento.
      </div>

      <div class="document-content">

        <textarea class="sophia-input" placeholder="Pega aquí un texto"></textarea>

        <button class="evaluate-btn">
          Evaluar
        </button>

        <div class="result" id="result"></div>

      </div>

    </main>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    LogoDemocracy · Sophia
  </footer>

</div>

<script src="/assets/js/layout.js"></script>
<script src="/assets/js/sophia.js"></script>

</body>
</html>
