<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — LogoDemocracy</title>
<style>
html,body{margin:0;padding:0;background:#000;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:"Courier New",monospace}
.box{width:100%;max-width:460px}
h1{font-size:24px;font-weight:400;margin:0 0 36px;color:#fff}
label{display:block;font-size:14px;margin:0 0 8px;color:#fff}
input{display:block;width:100%;height:46px;margin:0 0 22px;padding:0 12px;box-sizing:border-box;background:#111;color:#fff;border:1px solid #555;border-radius:0;font:inherit;font-size:16px}
button{display:block;width:100%;height:46px;background:#22c55e;color:#000;border:1px solid #22c55e;border-radius:0;font:inherit;font-size:15px;cursor:pointer}
#message{margin-top:20px;font-size:14px;line-height:1.5}
.error{color:#ff6b6b}
.success{color:#22c55e}
</style>
</head>
<body>

<div class="box">
<h1>Restablecer contraseña</h1>

<label for="password">Nueva contraseña</label>
<input id="password" type="password" minlength="8" autocomplete="new-password">

<label for="confirmation">Repetir contraseña</label>
<input id="confirmation" type="password" minlength="8" autocomplete="new-password">

<button type="button" onclick="resetPassword()">Cambiar contraseña</button>

<div id="message"></div>
</div>

<script>
async function resetPassword() {
  var message = document.getElementById('message');
  var button = document.querySelector('button');
  var password = document.getElementById('password').value;
  var confirmation = document.getElementById('confirmation').value;
  var token = new URLSearchParams(window.location.search).get('reset_token');

  if (!token) {
    message.className = 'error';
    message.textContent = 'El enlace de recuperación no contiene un token válido.';
    return;
  }

  if (password.length < 8) {
    message.className = 'error';
    message.textContent = 'La contraseña debe tener al menos 8 caracteres.';
    return;
  }

  if (password !== confirmation) {
    message.className = 'error';
    message.textContent = 'Las contraseñas no coinciden.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Actualizando…';
  message.className = '';
  message.textContent = 'Actualizando contraseña…';

  try {
    var response = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        token: token,
        password: password
      })
    });

    var data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'No se pudo actualizar la contraseña.');
    }

    localStorage.setItem('platform_token', data.token);
    localStorage.setItem('platform_user', JSON.stringify(data.user));

    if (!localStorage.getItem('platform_session_id')) {
      localStorage.setItem(
        'platform_session_id',
        'session-' + Date.now() + '-' + Math.random().toString(36).slice(2)
      );
    }

    message.className = 'success';
    message.textContent = 'Contraseña actualizada correctamente. Entrando a Rey Filósofo…';

    setTimeout(function() {
      window.location.href = '/pages/rey-filosofo.html';
    }, 700);

  } catch (error) {
    button.disabled = false;
    button.textContent = 'Cambiar contraseña';
    message.className = 'error';
    message.textContent = error.message || 'Ocurrió un error.';
  }
}
</script>

</body>
</html>
